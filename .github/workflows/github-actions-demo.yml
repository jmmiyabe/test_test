name: Laravel Sail CI

on:
  push:
    branches: [ "main" ]   # runs when pushing to main
  pull_request:
    branches: [ "main" ]   # runs on PRs to main
  workflow_dispatch:       # lets you run manually in GitHub UI

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: docker run --rm -v $(pwd):/app -w /app laravelsail/php82-composer:latest composer install --ignore-platform-reqs

      - name: Start Sail
        run: ./vendor/bin/sail up -d

      - name: Run migrations
        run: ./vendor/bin/sail artisan migrate --force

      - name: Run tests
        run: ./vendor/bin/sail test --parallel
